# ~/.config/kitty/themes/neovim-default.conf
# Inspired by Neovim's default colorscheme

foreground              #EEF1F8
background              #07080D
selection_foreground    #07080D
selection_background    #C4C6CD

cursor                  #A6DBFF
cursor_text_color       #07080D

url_color               #8cf8f7

active_border_color     #A6DBFF
inactive_border_color   #2c2e33
bell_border_color       #FFC0B9

active_tab_foreground   #07080D
active_tab_background   #A6DBFF
inactive_tab_foreground #9b9ea4
inactive_tab_background #14161B

# normal
color0  #14161B
color1  #590008
color2  #005523
color3  #6b5300
color4  #004c63
color5  #470045
color6  #007373
color7  #C4C6CD

# bright
color8   #4f5258
color9   #FFC0B9
color10  #b4f6c0
color11  #FCE094
color12  #A6DBFF
color13  #FFCAFF
color14  #8cf8f7
color15  #EEF1F8

# extended UI colors
mark1_foreground #07080D
mark1_background #A6DBFF

mark2_foreground #07080D
mark2_background #b4f6c0

mark3_foreground #07080D
mark3_background #FCE094

# window padding (optional)
window_padding_width 8

# slightly softer cursor blink
cursor_blink_interval 0.5

# better contrast for unfocused windows
dim_opacity 0.85
